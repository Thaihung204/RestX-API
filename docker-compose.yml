version: "3.8"

services:

  sqlserver:
      image: mcr.microsoft.com/mssql/server:2022-latest
      container_name: restx-sqlserver
      ports:
        - "1433:1433"
      networks:
        - restx-net
      volumes:
        - sql_data:/var/opt/mssql
      environment:
        ACCEPT_EULA: "Y"
        SA_PASSWORD: "RestX@12345"
        MSSQL_PID: "Developer"
      restart: unless-stopped
      
  redis:
    image: redis:7-alpine
    container_name: restx-redis
    ports:
      - "6379:6379"
    networks:
      - restx-net
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: RestX.Admin/Dockerfile
    container_name: restx-admin
    ports:
      - "4999:4999"
    networks:
      - restx-net
    environment:
      - ASPNETCORE_URLS=http://+:4999
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
        - sqlserver
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: RestX.WebApp/Dockerfile
    container_name: restx-webapp
    ports:
      - "5000:5000"
    networks:
      - restx-net
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__RedisConnection=redis:6379
    depends_on:
         - sqlserver
    volumes:
      - ./RestX.WebApp/wwwroot/Uploads:/app/wwwroot/Uploads
    restart: unless-stopped

networks:
  restx-net:
    driver: bridge

volumes:
  sql_data:
  redis_data: