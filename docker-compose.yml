services:
  proxy:
    build: ./ReverseProxy
    ports:
      - "443:443"
      - "80:80"
    container_name: restx-proxy
    networks:
      - restx-net

  frontend:
    build:
      context: ../RestX-FE
      dockerfile: Dockerfile
    container_name: restx-frontend
    ports:
      - "3000:3000"
    networks:
      - restx-net
  admin:
    build:
      context: .
      dockerfile: RestX.Admin/Dockerfile
    container_name: restx-admin
    ports:
      - "4999:4999"
    networks:
      - restx-net
    environment:
      - ASPNETCORE_URLS=http://+:4999
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - sqlserver

  web:
    build:
      context: .
      dockerfile: RestX.WebApp/Dockerfile
    container_name: restx-webapp
    ports:
    - "5000:5000"
    networks:
      - restx-net
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__RedisConnection=redis:6379
    depends_on:
      - sqlserver
    volumes:
      - ./RestX.WebApp/wwwroot/Uploads:/app/wwwroot/Uploads

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: restx-sqlserver
    ports:
    - "1433:1433"
    networks:
      - restx-net
    volumes:
      - sql_data:/var/opt/mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Passw0r1!"
      MSSQL_PID: "Developer"

  redis:
    image: redis:7-alpine
    container_name: restx-redis
    ports:
    - "6379:6379"
    networks:
      - restx-net
    volumes:
      - redis_data:/data

networks:
  restx-net:
    driver: bridge

volumes:
  sql_data:
  redis_data: